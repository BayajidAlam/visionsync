version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - /opt/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

volumes:
  redis-data:
