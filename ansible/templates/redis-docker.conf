# Redis Configuration for VisionSync (Docker Optimized)
# Much simpler than the previous 80+ line config

# Network
bind 0.0.0.0
port 6379

# Security
requirepass VisionSyncRedis2024!

# Memory (optimized for rate limiting)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (for durability)
save 900 1
save 300 10
save 60 10000
appendonly yes

# Logging
loglevel notice

# Performance (container optimized)
tcp-keepalive 300
timeout 0

# VisionSync specific: optimized for rate limiting workloads
