[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/vision-sync-backend
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

# Static template inventory.
# Preferred runtime inventory is ansible/live-inventory.ini generated by make create-inventory.

[bastion]
bastion ansible_host=REPLACE_BASTION_PUBLIC_IP

[frontend]
frontend ansible_host=REPLACE_FRONTEND_PUBLIC_IP

[backend]
backend ansible_host=REPLACE_BACKEND_PRIVATE_IP ansible_ssh_common_args='-o ProxyJump=ubuntu@REPLACE_BASTION_PUBLIC_IP -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[mongodb]
mongodb-1 ansible_host=REPLACE_MONGODB_PRIMARY_PRIVATE_IP ansible_ssh_common_args='-o ProxyJump=ubuntu@REPLACE_BASTION_PUBLIC_IP -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
mongodb-2 ansible_host=REPLACE_MONGODB_SECONDARY_PRIVATE_IP ansible_ssh_common_args='-o ProxyJump=ubuntu@REPLACE_BASTION_PUBLIC_IP -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
mongodb-3 ansible_host=REPLACE_MONGODB_ARBITER_PRIVATE_IP ansible_ssh_common_args='-o ProxyJump=ubuntu@REPLACE_BASTION_PUBLIC_IP -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[redis]
redis ansible_host=REPLACE_REDIS_PRIVATE_IP ansible_ssh_common_args='-o ProxyJump=ubuntu@REPLACE_BASTION_PUBLIC_IP -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
