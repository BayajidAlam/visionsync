---
# VisionSync Infrastructure Setup
# Sets up the complete multi-instance architecture:
# - MongoDB 3-node replica set in private subnet
# - Redis instance in private subnet
# All private instances are accessed via bastion host (Ansible runs on bastion).

- name: Setup MongoDB Replica Set Infrastructure
  import_playbook: mongodb-replica-setup.yml
  tags: ["mongodb", "database"]

- name: Setup Redis Cache Server
  import_playbook: redis-docker-setup.yml
  tags: ["redis", "cache"]
