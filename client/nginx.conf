server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Never cache index.html — Vite hashes JS/CSS filenames but not index.html.
    # Without this, the browser serves stale index.html after a redeployment,
    # which references the OLD hashed JS file and ignores the new bundle entirely.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # Vite-hashed assets (index-BYmS3ZVd.js etc.) are immutable — cache forever.
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
